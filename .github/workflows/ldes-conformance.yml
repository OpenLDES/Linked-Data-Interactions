name: LDES 1.0 conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ldes-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: OpenLDES client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out client
        uses: actions/checkout@v5
        with:
          path: client

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: client/**/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run LDES 1.0 conformance tests
        run: >
          client/scripts/run-ldes-conformance.sh
          --fail-on-non-pass
          --report-dir "${{ github.workspace }}/ldes-conformance-report"

      - name: Add coverage report to job summary
        if: always()
        run: |
          if [ -f ldes-conformance-report/coverage.md ]; then
            cat ldes-conformance-report/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ldes-conformance-${{ github.sha }}
          path: ldes-conformance-report
          if-no-files-found: error
