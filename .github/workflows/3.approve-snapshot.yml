name: 3. Approve Snapshot

on:
  release:
    types: [ published ]
  workflow_dispatch:

env:
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION }}
  GIT_CONFIG_USERNAME: ${{ vars.GIT_CONFIG_USERNAME }}
  GIT_CONFIG_EMAIL: ${{ vars.GIT_CONFIG_EMAIL }}

permissions:
  contents: write
  pull-requests: write

jobs:
  approve-snapshot:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.release.target_commitish == 'main') }}
    name: Approve Snapshot and Promote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Promote snapshot version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "current version: $VERSION"
          if [[ $VERSION == *"-SNAPSHOT" ]]; then
            NEWVERSION="${VERSION%-SNAPSHOT}"
            mvn -B versions:set -DnewVersion="$NEWVERSION" -DgenerateBackupPoms=false
            echo "NEW_VERSION=$NEWVERSION" >> "$GITHUB_ENV"
          else
            echo "Already released. Current version: $VERSION"
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ env.NEW_VERSION != '' }}
        with:
          base: main
          committer: ${{ env.GIT_CONFIG_USERNAME }} <${{ env.GIT_CONFIG_EMAIL }}>
          commit-message: 'ci: Promoted version to ${{ env.NEW_VERSION }}'
          add-paths: |
            pom.xml
            **/pom.xml
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: ci/promote-snapshot
          delete-branch: true
          title: '[ci] Promote snapshot ${{ env.NEW_VERSION }}'
          body: |
            As part of QA process, the snapshot version is being promoted to a release version.
          labels: |
            promotion
            automated pr
