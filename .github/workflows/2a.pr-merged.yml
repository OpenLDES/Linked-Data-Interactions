name: 2.a. Build & Deploy Project

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  DOCKER_HUB_NAMESPACE: ${{ vars.DOCKER_NAMESPACE }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  DEPLOY_PACKAGE_TO_OSSRH: ${{ vars.DEPLOY_PACKAGE_TO_OSSRH }}
  ANALYSE_PACKAGE: ${{ vars.ANALYSE_PACKAGE }}
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java with GPG private key
        if: ${{ fromJSON(env.DEPLOY_PACKAGE_TO_OSSRH || 'false') == true }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          server-id: ossrh
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE
      - name: Set up Java
        if: ${{ fromJSON(env.DEPLOY_PACKAGE_TO_OSSRH || 'false') != true }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Determine version
        id: determine-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Analyse package and publish Sonar Cloud analysis
        if: ${{ fromJSON(env.ANALYSE_PACKAGE || 'false') == true }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} -Pcoverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Create package
        if: ${{ fromJSON(env.ANALYSE_PACKAGE || 'false') != true }}
        run: mvn -B verify
      - name: Publish package
        if: ${{ fromJSON(env.DEPLOY_PACKAGE_TO_OSSRH || 'false') == true }}
        run: mvn deploy -DskipTests -Dmaven.javadoc.skip=true -B -P release
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Upload JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          if-no-files-found: error
          path: |
            **/*with-dependencies.jar
            **/*application.jar
            **/ldes-discoverer.jar
            **/ldio-instrumentation.jar

  create-image:
    name: Build and push ${{ matrix.image }}
    # Main publishes to Docker Hub; develop and manual builds on other branches publish to GHCR.
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ldi-orchestrator
            dockerfile: ldio.Dockerfile
            ghcr-repository: ${{ vars.GHCR_LDIO_REPO }}
          - image: ldes-discoverer
            dockerfile: ldes-discoverer.Dockerfile
            ghcr-repository: ${{ vars.GHCR_DISCOVERER_REPO }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE_NAME: ${{ matrix.image }}
      GHCR_IMAGE_REPOSITORY: ${{ matrix.ghcr-repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts
          path: .github
      - name: Define docker variables
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=$VERSION" >> "$GITHUB_ENV"
            IMAGES="$DOCKER_HUB_NAMESPACE/$IMAGE_NAME"
          else
            echo "IMAGE_TAG=$VERSION-$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_ENV"
            IMAGES="$GHCR_REGISTRY/$GHCR_IMAGE_REPOSITORY"
          fi
          echo "IMAGES=$IMAGES" >> "$GITHUB_ENV"
      - name: Log in to the DockerHub Container registry
        if: github.ref_name == 'main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to the GitHub Container registry
        if: github.ref_name != 'main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ github.ref_name != 'main' || !contains(needs.build.outputs.version, 'SNAPSHOT') }}
          flavor: latest=false
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github
          file: .github/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
